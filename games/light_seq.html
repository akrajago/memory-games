<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Sequence</title>
    <link rel="stylesheet" href="../styles.css"/>
</head>
<body>
    <div class="title">
        <h1>Light Sequence</h1>
        <button class="rule-button">?</button>
    </div>

    <dialog class="rule-modal" closedby="any">
        <p>
            Click the circles in the order they are presented.
            Each round adds one extra circle to the sequence!
        </p>
        <i>
            (Press esc or click outside the box to close)
        </i>
    </dialog>

    <h2 id="circles-clicked"><!-- Display circles clicked here--></h2>
    <div id="sequence">
        <button class="circle" data-index="0"></button>
        <button class="circle" data-index="1"></button>
        <button class="circle" data-index="2"></button>
        <button class="circle" data-index="3"></button>
    </div>
    <button class="start-button">Start</button>

    <dialog class="score-modal">
        <p>Game over!</p>
        <p class="score"><!-- Display score here --></p>
        <button class="return-button">Return</button>
    </dialog>
    <script src="../js/light_seq.js"></script>
</body>
</html>
